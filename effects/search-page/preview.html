<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AO3 Search Page — Preview</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../_shared/preview-shell.css">
  <link rel="stylesheet" href="work-skin.css">
  <style>
    #workskin {
      width: 820px;
      padding: 0;
    }
  </style>
</head>
<body>
<main class="shell">
  <section class="hero">
    <p class="hero__label">AO3 Effect Preview</p>
    <h1 class="hero__title">Search Page</h1>
    <p class="hero__desc">A static search-page mockup with a colored wordmark and muted prompt.</p>
  </section>
  <div id="workskin">
    <div class="search-page">
      <span class="wordmark" aria-label="Google"><span class="letter letter--blue">G</span><span class="letter letter--red">o</span><span class="letter letter--yellow">o</span><span class="letter letter--blue">g</span><span class="letter letter--green">l</span><span class="letter letter--red">e</span></span>
      <div class="search-field">
        <img class="search-icon" src="https://www.gstatic.com/images/icons/material/system/2x/search_grey600_24dp.png" alt="">
        <span class="search-hint">Search for a memory...</span>
      </div>
    </div>
  </div>
</main>
</body>
</html>
